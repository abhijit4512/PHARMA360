services:
  db:
    image: postgres:16-alpine
    container_name: pharma360-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pharma360
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pharma360_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pharma360"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    container_name: pharma360-api
    restart: unless-stopped
    env_file: ./backend/.env
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pharma360_pgdata:
